---
- name: Automated Enterprise Linux Patching & Validation
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Verify OS family compatibility
      ansible.builtin.assert:
        that:
          - ansible_os_family in ["Debian", "RedHat"]
        fail_msg: "Unsupported OS family detected."

    - name: Update apt cache and upgrade packages (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
      when: ansible_os_family == "Debian"
      register: apt_result

    - name: Upgrade all packages (RHEL/Amazon Linux)
      ansible.builtin.yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
      register: yum_result

    - name: Check if system reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"

    - name: Reboot server safely if kernel updates require it
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible automated patching pipeline"
        connect_timeout: 5
        reboot_timeout: 300
      when:
        - ansible_os_family == "Debian"
        - reboot_required_file.stat.exists
